<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1225" />
  <meta name="description" content="Bomba Nova: una aventura arcade original de laberintos, explosiones y enemigos hecha con Phaser 3." />
  <title>BOMBA NOVA | Laberinto Neón</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="site-shell">
    <div class="topline"><span class="status-dot"></span> ARCADE ORIGINAL <span class="topline-sep">/</span> DESARROLLADO CON PHASER 3</div>
    <main id="game-container" aria-label="Videojuego Bomba Nova"></main>
    <footer>UN UNIVERSO DE LABERINTOS Y EXPLOSIONES <span>✦</span> FLECHAS / WASD · ESPACIO · ESC</footer>
  </div>
  <noscript>Activa JavaScript para jugar a Bomba Nova.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js" onerror="this.onerror=null;this.src='https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js';"></script>
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/PreloaderScene.js"></script>
  <script src="js/scenes/MenuScene.js"></script>
  <script src="js/scenes/HelpScene.js"></script>
  <script src="js/scenes/SettingsScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/HUDScene.js"></script>
  <script src="js/scenes/ResultScene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
